name: Orkestrasyon Dogrulama Hatti (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 1. Sartname Dogrulama (Spec Validation)
      run: |
        python -m tools.cli validate-spec templates/spec-driven-template.md

    - name: 2. Kod Korkuluk Taramasi (Guardrails Scan)
      run: |
        python -m tools.cli scan-guardrails .

    - name: 3. Eval ve Property Testleri Kosumu
      run: |
        python -m tools.cli run-evals

    - name: 4. Ornek Servis Birim ve Concurrency Testleri
      run: |
        cd examples/resilient-payment-service
        python -m unittest test_service.py
