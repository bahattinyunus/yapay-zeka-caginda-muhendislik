name: Orkestrasyon Dogrulama Hatti (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 1. Tum Sistem Denetimi (Spec + Guardrails + Evals + Benchmark)
      run: |
        python -m tools.cli check-all

    - name: 2. Coklu Ajan Orkestrasyon Motoru Testi
      run: |
        python examples/agent-workflow-orchestrator/workflow.py

    - name: 3. Ornek Odeme Servisi Concurrency Testleri
      run: |
        cd examples/resilient-payment-service
        python -m unittest test_service.py

    - name: 4. Sistem Denetim Raporu Uretimi
      run: |
        python -m tools.cli report AUDIT_REPORT.md
